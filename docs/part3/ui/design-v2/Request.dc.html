<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>이송 요청 창</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D56C9}a:hover{color:#163F94}
</style>
</helmet>
<div style="position: relative; min-height: 980px; color: #1B2026; font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.5">
<dc-import name="Main" hint-size="100%,980px"></dc-import>

<div style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: 64px 24px 24px; background: rgba(27, 32, 38, 0.55)">
<section role="dialog" aria-modal="true" aria-labelledby="req-title" style="width: 100%; max-width: 760px; overflow: hidden; border-radius: 12px; background: #FFFFFF; box-shadow: 0 24px 56px rgba(0, 0, 0, 0.32)">

<div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 16px 28px; border-bottom: 1px solid #E1E5E9">
<h2 id="req-title" style="margin: 0; font-size: 20px; font-weight: 700">이송 요청</h2>
<button type="button" aria-label="닫기" style="margin-left: auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: #FFFFFF; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13" stroke="#1B2026" stroke-width="2" stroke-linecap="round"></path></svg>
</button>
</div>

<div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 28px 24px">

<div role="tablist" aria-label="요청 종류" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}">
<button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border: 2px solid #1B2026; border-radius: 8px; background: #1B2026; color: #FFFFFF; font: inherit; text-align: left; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 13px; color: #D5DAE0">{{t.robot}}</span>
</button>
</sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{true}}">
<button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 14px; border: 2px solid #CBD1D7; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; text-align: left; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">{{t.name}}</span>
<span style="font-size: 13px; color: #57616B">{{t.robot}}</span>
</button>
</sc-if>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">{{pickTitle}}</h3>
<span style="color: #57616B; font-size: 13px">{{pickHint}}</span>
</div>
<div style="display: flex; flex-direction: column; padding: 10px; border: 1px solid #CBD1D7; border-radius: 10px; background: #F7F8F9">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{topZones}}" as="z" hint-placeholder-count="3">
<sc-if value="{{z.selected}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" aria-label="{{z.aria}}" onClick="{{z.pick}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border: 2px solid #1B2026; border-radius: 8px; background: #1B2026; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: #FFFFFF; color: #1B2026; font-size: 13px; font-weight: 700">{{z.badge}}</span>
<span>{{z.name}}</span>
</button>
</sc-if>
<sc-if value="{{z.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" aria-label="{{z.aria}}" onClick="{{z.pick}}" style="display: flex; align-items: center; justify-content: center; height: 60px; border: 1px solid #9AA3AD; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{z.name}}</button>
</sc-if>
</sc-for>
</div>
<div aria-hidden="true" style="margin: 8px 0; padding: 2px 0; border-radius: 4px; background: #E3E9F0; color: #57616B; font-size: 12px; text-align: center">복도</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{bottomZones}}" as="z" hint-placeholder-count="3">
<sc-if value="{{z.selected}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" aria-label="{{z.aria}}" onClick="{{z.pick}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 60px; border: 2px solid #1B2026; border-radius: 8px; background: #1B2026; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">
<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 14px; background: #FFFFFF; color: #1B2026; font-size: 13px; font-weight: 700">{{z.badge}}</span>
<span>{{z.name}}</span>
</button>
</sc-if>
<sc-if value="{{z.unselected}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" aria-label="{{z.aria}}" onClick="{{z.pick}}" style="display: flex; align-items: center; justify-content: center; height: 60px; border: 1px solid #9AA3AD; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{z.name}}</button>
</sc-if>
</sc-for>
</div>
</div>
</div>

<sc-if value="{{isPatient}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">환자 ID <span style="color: #B4231B; font-weight: 500">필수</span></span><input placeholder="차트번호" style="height: 40px; padding: 0 12px; border: 1px solid #9AA3AD; border-radius: 6px; background: #FFFFFF; color: #1B2026; font: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">이름 <span style="color: #57616B; font-weight: 400">선택</span></span><input style="height: 40px; padding: 0 12px; border: 1px solid #9AA3AD; border-radius: 6px; background: #FFFFFF; color: #1B2026; font: inherit"></label>
<label style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600">손목 태그</span><input disabled placeholder="QR 연동 후 사용" style="height: 40px; padding: 0 12px; border: 1px dashed #B7BFC8; border-radius: 6px; background: #EEF0F2; color: #57616B; font: inherit; cursor: not-allowed"></label>
</div>
</sc-if>

<sc-if value="{{isMed}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">정류장별 약품</h3>
<sc-if value="{{noStops}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; color: #57616B">아직 고른 구역이 없습니다. 위에서 구역을 누르세요.</p>
</sc-if>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{stopRows}}" as="s" hint-placeholder-count="3">
<li style="display: flex; align-items: center; gap: 12px">
<span style="display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 14px; background: #1B2026; color: #FFFFFF; font-size: 13px; font-weight: 700">{{s.n}}</span>
<span style="min-width: 56px; font-weight: 600">{{s.zone}}</span>
<input aria-label="{{s.itemLabel}}" value="{{s.item}}" onChange="{{s.setItem}}" placeholder="약품 이름" style="flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #9AA3AD; border-radius: 6px; background: #FFFFFF; color: #1B2026; font: inherit">
<button type="button" aria-label="{{s.removeLabel}}" onClick="{{s.remove}}" style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #CBD1D7; border-radius: 6px; background: #FFFFFF; cursor: pointer">
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2L2 10" stroke="#57616B" stroke-width="2" stroke-linecap="round"></path></svg>
</button>
</li>
</sc-for>
</ol>
</div>
</sc-if>

<sc-if value="{{isCall}}" hint-placeholder-val="{{false}}">
<label style="display: flex; flex-direction: column; gap: 4px; max-width: 360px"><span style="font-weight: 600">가져올 것 <span style="color: #57616B; font-weight: 400">선택</span></span><input placeholder="예: 빈 약품 상자 회수" style="height: 40px; padding: 0 12px; border: 1px solid #9AA3AD; border-radius: 6px; background: #FFFFFF; color: #1B2026; font: inherit"></label>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">응급도</h3>
<div role="radiogroup" aria-label="응급도" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
<sc-if value="{{l.onNormal}}" hint-placeholder-val="{{false}}">
<button type="button" role="radio" aria-checked="true" onClick="{{l.pick}}" style="display: flex; align-items: baseline; justify-content: center; gap: 8px; height: 48px; border: 2px solid #1B2026; border-radius: 8px; background: #1B2026; color: #FFFFFF; font: inherit; cursor: pointer"><span style="font-size: 16px; font-weight: 700">{{l.name}}</span><span style="font-size: 13px; color: #D5DAE0">{{l.levelText}}</span></button>
</sc-if>
<sc-if value="{{l.onUrgent}}" hint-placeholder-val="{{false}}">
<button type="button" role="radio" aria-checked="true" onClick="{{l.pick}}" style="display: flex; align-items: baseline; justify-content: center; gap: 8px; height: 48px; border: 2px solid #B4231B; border-radius: 8px; background: #B4231B; color: #FFFFFF; font: inherit; cursor: pointer"><span style="font-size: 16px; font-weight: 700">{{l.name}}</span><span style="font-size: 13px; color: #FBE7E5">{{l.levelText}}</span></button>
</sc-if>
<sc-if value="{{l.off}}" hint-placeholder-val="{{true}}">
<button type="button" role="radio" aria-checked="false" onClick="{{l.pick}}" style="display: flex; align-items: baseline; justify-content: center; gap: 8px; height: 48px; border: 1px solid #9AA3AD; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; cursor: pointer"><span style="font-size: 16px; font-weight: 600">{{l.name}}</span><span style="font-size: 13px; color: #57616B">{{l.levelText}}</span></button>
</sc-if>
</sc-for>
</div>
</div>

</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 16px 28px; background: #F7F8F9; border-top: 1px solid #E1E5E9">
<p aria-live="polite" style="margin: 0; flex: 1 1 320px; font-size: 15px">{{summary}}</p>
<button type="button" onClick="{{reset}}" style="height: 44px; padding: 0 16px; border: 1px solid #9AA3AD; border-radius: 6px; background: #FFFFFF; color: #1B2026; font: inherit; cursor: pointer">초기화</button>
<sc-if value="{{ready}}" hint-placeholder-val="{{true}}">
<button type="button" style="height: 44px; padding: 0 22px; border: 0; border-radius: 6px; background: #1D56C9; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">요청 등록</button>
</sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{false}}">
<button type="button" disabled style="height: 44px; padding: 0 22px; border: 1px dashed #B7BFC8; border-radius: 6px; background: #EEF0F2; color: #57616B; font: inherit; font-size: 15px; font-weight: 700; cursor: not-allowed">요청 등록</button>
</sc-if>
</div>

</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { tab: 'med', stops: ['B', 'A', 'C'], level: 2, items: { B: '인슐린', A: '진통제' } };
}
maxFor(tab) {
return tab === 'med' ? 6 : (tab === 'patient' ? 2 : 1);
}
pickZone(z) {
const max = this.maxFor(this.state.tab);
const cur = this.state.stops.slice();
const at = cur.indexOf(z);
if (at >= 0) { cur.splice(at, 1); }
else if (cur.length < max) { cur.push(z); }
else { cur[cur.length - 1] = z; }
this.setState({ stops: cur });
}
renderVals() {
const s = this.state;
const tab = s.tab;
const badgeFor = (i) => tab === 'med' ? String(i + 1) : (tab === 'patient' ? (i === 0 ? '출발' : '도착') : '목적지');
const zoneObj = (z) => {
const i = s.stops.indexOf(z);
return {
name: z + '구역',
selected: i >= 0,
unselected: i < 0,
badge: i >= 0 ? badgeFor(i) : '',
aria: z + '구역' + (i >= 0 ? ', ' + badgeFor(i) : ''),
pick: () => this.pickZone(z)
};
};
const tabs = [
{ id: 'patient', name: '환자 이송', robot: '침상형 이송 로봇' },
{ id: 'med', name: '약품 운송', robot: '약품 운송 로봇' },
{ id: 'call', name: '로봇 호출', robot: '약품 운송 로봇' }
].map((t) => ({
name: t.name,
robot: t.robot,
on: t.id === tab,
off: t.id !== tab,
pick: () => this.setState({ tab: t.id, stops: this.state.stops.slice(0, this.maxFor(t.id)) })
}));
const levels = [{ n: 1, name: '비응급' }, { n: 2, name: '보통' }, { n: 3, name: '응급' }].map((l) => ({
name: l.name,
levelText: 'Level ' + l.n,
onNormal: s.level === l.n && l.n !== 3,
onUrgent: s.level === l.n && l.n === 3,
off: s.level !== l.n,
pick: () => this.setState({ level: l.n })
}));
const names = s.stops.map((z) => z + '구역');
const stopRows = s.stops.map((z, i) => ({
n: String(i + 1),
zone: z + '구역',
item: s.items[z] || '',
itemLabel: (i + 1) + '번째 정류장 ' + z + '구역 약품',
removeLabel: z + '구역 빼기',
setItem: (e) => {
const v = e.target.value;
const next = Object.assign({}, this.state.items);
next[z] = v;
this.setState({ items: next });
},
remove: () => this.setState({ stops: this.state.stops.filter((x) => x !== z) })
}));
let summary = '';
let pickTitle = '';
let pickHint = '';
let ready = false;
if (tab === 'med') {
pickTitle = '들를 구역';
pickHint = '누른 순서대로 들릅니다. 다시 누르면 빠집니다. 6곳까지 고를 수 있습니다.';
ready = s.stops.length >= 1;
summary = ready ? '약품 운송 로봇이 ' + names.join(' → ') + ' 순서로 갑니다. 정류장마다 화면에서 확인을 받습니다.' : '들를 구역을 순서대로 누르세요.';
} else if (tab === 'patient') {
pickTitle = '출발과 도착';
pickHint = '처음 누른 곳이 출발, 다음에 누른 곳이 도착입니다.';
ready = s.stops.length === 2;
summary = ready ? '침상형 이송 로봇이 ' + names[0] + '에서 환자를 태워 ' + names[1] + '으로 갑니다.' : (s.stops.length === 1 ? '도착 구역을 누르세요.' : '환자를 태울 구역부터 누르세요.');
} else {
pickTitle = '부를 곳';
pickHint = '한 곳만 고릅니다.';
ready = s.stops.length === 1;
summary = ready ? '약품 운송 로봇이 ' + names[0] + '으로 갑니다.' : '로봇을 부를 구역을 누르세요.';
}
return {
tabs: tabs,
levels: levels,
stopRows: stopRows,
summary: summary,
pickTitle: pickTitle,
pickHint: pickHint,
topZones: ['D', 'E', 'F'].map(zoneObj),
bottomZones: ['A', 'B', 'C'].map(zoneObj),
isPatient: tab === 'patient',
isMed: tab === 'med',
isCall: tab === 'call',
noStops: s.stops.length === 0,
ready: ready,
notReady: !ready,
reset: () => this.setState({ stops: [], items: {}, level: 1 })
};
}
}
</script>
</body>
</html>
