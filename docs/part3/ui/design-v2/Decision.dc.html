<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>결정 카드 막힘</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1D56C9}a:hover{color:#163F94}
</style>
</helmet>
<div style="position: relative; min-height: 980px; color: #1B2026; font-family: 'IBM Plex Sans KR', 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.5">
<dc-import name="Main" hint-size="100%,980px"></dc-import>

<div style="position: absolute; inset: 0; display: flex; justify-content: center; align-items: flex-start; padding: 140px 24px 24px; background: rgba(27, 32, 38, 0.55)">
<section role="dialog" aria-modal="true" aria-labelledby="card-title" style="width: 100%; max-width: 600px; overflow: hidden; border-radius: 12px; background: #FFFFFF; box-shadow: 0 24px 56px rgba(0, 0, 0, 0.32)">
<div style="display: flex; align-items: center; gap: 12px; padding: 20px 28px; background: #FFF0D4; border-bottom: 1px solid #E3C58A">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 28 28"><rect x="3" y="3" width="22" height="22" rx="5" fill="#1B2026"></rect><text x="14" y="19" text-anchor="middle" font-family="IBM Plex Sans KR, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">B</text></svg>
<h2 id="card-title" style="margin: 0; font-size: 21px; font-weight: 700">약품 운송 로봇이 막혔습니다</h2>
<span style="margin-left: auto; color: #6B4100; font-weight: 600; font-variant-numeric: tabular-nums">32초째 정지</span>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 24px 28px 24px">
<p style="margin: 0; font-size: 16px">C구역에서 F구역으로 가는 길에 앞에 사람이 감지되어 멈춰 있습니다.</p>
<dl style="display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 20px; margin: 0">
<dt style="color: #57616B">작업</dt><dd style="margin: 0">M-0002 약품 운송, Level 2</dd>
<dt style="color: #57616B">멈춘 곳</dt><dd style="margin: 0">C구역과 F구역 사이</dd>
<dt style="color: #57616B">앞에 있는 것</dt><dd style="margin: 0; font-weight: 600">사람</dd>
</dl>
<h3 style="margin: 4px 0 0; font-size: 15px; font-weight: 700">어떻게 할까요?</h3>
<div role="group" aria-label="선택지" style="display: flex; flex-direction: column; gap: 8px">
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border: 1px solid #9AA3AD; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; text-align: left; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">다시 출발</span>
<span style="color: #57616B">사람이 비켰으면 원래 경로로 다시 갑니다.</span>
</button>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border: 1px solid #9AA3AD; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; text-align: left; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">되돌아가기</span>
<span style="color: #57616B">C구역으로 돌아가서 기다립니다.</span>
</button>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 16px; border: 1px solid #9AA3AD; border-radius: 8px; background: #FFFFFF; color: #1B2026; font: inherit; text-align: left; cursor: pointer">
<span style="font-size: 16px; font-weight: 700">보류</span>
<span style="color: #57616B">지금 자리에 멈춘 채로 둡니다. 나중에 다시 고를 수 있습니다.</span>
</button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 12px; border-top: 1px solid #E1E5E9">
<p style="margin: 0; color: #57616B">고르기 전까지 로봇은 멈춰 있습니다.</p>
<button type="button" style="margin-left: auto; height: 40px; padding: 0 16px; border: 1px solid #9AA3AD; border-radius: 6px; background: #FFFFFF; color: #1B2026; font: inherit; cursor: pointer">나중에</button>
</div>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
